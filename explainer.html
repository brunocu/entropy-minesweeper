<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What does any of this mean? — Entropy Minesweeper</title>
    <link rel="stylesheet" href="/src/design/tokens.css" />
    <style>
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: 17px;
        line-height: 1.68;
      }

      #explainer {
        max-width: 46rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 6rem;
      }

      a {
        color: var(--safe);
        text-decoration-color: rgba(13, 54, 107, 0.35);
        text-underline-offset: 2px;
      }

      a:hover {
        text-decoration-color: currentColor;
      }

      h1 {
        font-size: 2.15rem;
        line-height: 1.18;
        margin: 0 0 0.35em;
      }

      h2 {
        font-size: 1.42rem;
        margin: 2.8em 0 0.5em;
        padding-top: 1em;
        border-top: 1px solid var(--rule);
      }

      h2:first-of-type {
        border-top: none;
        padding-top: 0;
      }

      h3 {
        font-size: 1.1rem;
        margin: 2em 0 0.4em;
      }

      /* The lede is always the paragraph immediately following the title - no class needed. */
      #explainer h1 + p {
        font-size: 1.14rem;
        color: var(--ink-soft);
      }

      .back-link {
        display: inline-block;
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      /* --- MathJax --- */

      /* Formulas are TeX source (`\(...\)`/`\[...\]`-delimited text) in the compiled markup,
         typeset in the browser by the CDN bundle loaded at the end of this file. MathJax ships
         its own stylesheet at runtime (including the rules that let an over-wide display
         equation scroll instead of widening the page); these are just the page's own additions. */
      mjx-container[display] {
        margin: 1.5em 0;
        padding: 0.35em 0;
      }

      mjx-container {
        color: var(--ink);
      }

      /* --- Prose furniture --- */

      .callout {
        margin: 1.7em 0;
        padding: 1rem 1.2rem;
        border-left: 3px solid var(--eig);
        background: var(--surface);
        border-radius: 0 6px 6px 0;
      }

      .callout p:first-child {
        margin-top: 0;
      }

      .callout p:last-child {
        margin-bottom: 0;
      }

      figure {
        margin: 1.9em 0;
        padding: 1.1rem;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 8px;
      }

      /* Illustrations are standalone .svg files generated at build time from the solver, loaded
         as images. They carry their own intrinsic width/height, so scaling needs both rules. */
      figure img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      /* A bare image directive body (one not already wrapped in a raw HTML div) gets wrapped in
         a paragraph by the Markdown parser, unlike the hand-authored HTML this replaces - zero
         its margin so it doesn't introduce space the old markup didn't have. */
      figure > p {
        margin: 0;
      }

      .figure-scroll {
        overflow-x: auto;
      }

      /* The introduction's boards are small enough to sit at their natural size, which leaves them
         stranded against the left edge of a wide figure. */
      .board-figure img {
        margin-inline: auto;
      }

      /* The worlds trees are wider than the prose column. Let them break out of it up to the
         viewport, falling back to scrolling only when even that is not enough. */
      .figure-wide {
        width: min(94vw, 1080px);
        margin-left: calc(50% - min(47vw, 540px));
      }

      .root-board-panel {
        display: flex;
        justify-content: center;
        padding-bottom: 1rem;
        margin-bottom: 0.6rem;
        border-bottom: 1px dashed var(--rule);
      }

      .root-board-panel img {
        max-width: min(100%, 420px);
      }

      figcaption {
        margin-top: 0.85rem;
        font-size: 0.9rem;
        color: var(--ink-soft);
        line-height: 1.55;
      }

      /* The figcaption directive's Markdown content is now wrapped in a real `<p>`, unlike the
         hand-authored HTML this replaces - zero its margin the same way `.callout` already does. */
      figcaption p:first-child {
        margin-top: 0;
      }

      figcaption p:last-child {
        margin-bottom: 0;
      }

      /* MathJax sizes itself to the surrounding font; keep captions' inline math in scale. */
      figcaption mjx-container {
        color: var(--ink-soft);
      }

      code {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 0.9em;
        background: #ebe9e4;
        padding: 0.1em 0.35em;
        border-radius: 3px;
      }

      .term-safe {
        color: var(--safe);
        font-weight: 600;
      }
      .term-mine {
        color: var(--mine);
        font-weight: 600;
      }
      .term-clue {
        color: var(--clue);
        font-weight: 600;
      }
      .term-premise {
        color: var(--premise);
        font-weight: 600;
      }

      /* --- Interactive demo --- */

      .demo {
        margin: 1.9em 0;
        padding: 1.25rem;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 8px;
      }

      .demo-board {
        display: flex;
        justify-content: center;
      }

      #demo-canvas {
        max-width: 100%;
      }

      .demo-readouts {
        display: flex;
        flex-wrap: wrap;
        gap: 1.75rem;
        align-items: flex-end;
        margin: 1.2rem 0 0;
      }

      .demo-readout {
        min-width: 10rem;
      }

      .demo-readout dt {
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
      }

      .demo-readout dd {
        margin: 0.15em 0 0;
        font-size: 1.5rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      #demo-predicted {
        color: var(--eig);
      }

      #demo-reset {
        font: inherit;
        font-weight: 600;
        padding: 0.45em 1.1em;
        border: 1px solid var(--safe);
        border-radius: 6px;
        background: transparent;
        color: var(--safe);
        cursor: pointer;
      }

      #demo-reset:disabled {
        opacity: 0.4;
        cursor: default;
      }

      #demo-narration {
        margin: 1.1rem 0 0;
        font-size: 0.95rem;
        color: var(--ink-soft);
        line-height: 1.6;
      }
    </style>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]']],
        },
        svg: {
          // One shared glyph cache for the whole page instead of per-formula copies, and
          // scrolling rather than page-widening for equations too wide for the prose column.
          fontCache: 'global',
          displayOverflow: 'scroll',
        },
      }
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"
      integrity="sha384-KKWa9jJ1MZvssLeOoXG6FiOAZfAgmzsIIfw8BXwI9+kYm0lPCbC6yTQPBC00F1/L"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main id="explainer">
      <a class="back-link" href="/index.html">&#8592; Back to the game</a>
      <!--explainer-content-->
    </main>
    <script type="module" src="/src/explainer/main.ts"></script>
  </body>
</html>
